<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="Ayacucho - Plaza de Huamanga, Ciudad de las 33 Iglesias">
  <title>Ayacucho - Plaza de Huamanga</title>
  <desc>Emblema calido y rustico: la catedral y los portales de la Plaza de Huamanga al atardecer, con la sierra andina al fondo y la pileta en primer plano.</desc>

  <defs>
    <linearGradient id="atardecer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9D08A"/>
      <stop offset="42%" stop-color="#F0A45E"/>
      <stop offset="78%" stop-color="#D9713C"/>
      <stop offset="100%" stop-color="#B24C2A"/>
    </linearGradient>
    <linearGradient id="sierraLejana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8643F"/>
      <stop offset="100%" stop-color="#8B4A2E"/>
    </linearGradient>
    <linearGradient id="sierraCercana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E4028"/>
      <stop offset="100%" stop-color="#5E2C1C"/>
    </linearGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9643C"/>
      <stop offset="100%" stop-color="#8A5030"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6D2"/>
      <stop offset="70%" stop-color="#FFE29A"/>
      <stop offset="100%" stop-color="#FFD87A"/>
    </radialGradient>
    <clipPath id="interior">
      <rect x="18" y="18" width="476" height="476" rx="88"/>
    </clipPath>
  </defs>

  <!-- marco de ceramica -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#6B2A1A"/>
  <g clip-path="url(#interior)">
    <rect x="18" y="18" width="476" height="476" fill="url(#atardecer)"/>

    <!-- sol de atardecer -->
    <circle cx="256" cy="150" r="96" fill="#FFE9A8" opacity="0.22"/>
    <circle cx="256" cy="150" r="64" fill="url(#sol)"/>

    <!-- aves -->
    <g fill="none" stroke="#7E4028" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M104 104 q10 -9 20 0 q10 -9 20 0"/>
      <path d="M368 88 q8 -7 16 0 q8 -7 16 0"/>
      <path d="M300 132 q6 -5 12 0 q6 -5 12 0"/>
    </g>

    <!-- sierra lejana -->
    <polygon points="18,322 116,196 232,322" fill="url(#sierraLejana)" opacity="0.55"/>
    <polygon points="116,196 88,236 144,236" fill="#FBE3B4" opacity="0.75"/>
    <polygon points="186,322 306,178 494,322" fill="url(#sierraLejana)" opacity="0.5"/>
    <polygon points="306,178 272,222 340,222" fill="#FBE3B4" opacity="0.8"/>

    <!-- sierra cercana -->
    <polygon points="18,344 96,252 196,344" fill="url(#sierraCercana)" opacity="0.75"/>
    <polygon points="322,344 420,250 494,344" fill="url(#sierraCercana)" opacity="0.8"/>

    <!-- empedrado de la plaza -->
    <path d="M18 332 H494 V494 H18 Z" fill="url(#canal)"/>
    <g stroke="#7E4028" stroke-width="2" opacity="0.35">
      <path d="M18 356 H494"/>
      <path d="M18 384 H494"/>
      <path d="M18 416 H494"/>
    </g>
    <ellipse cx="256" cy="372" rx="118" ry="26" fill="#C08B58" opacity="0.5"/>

    <!-- portales laterales -->
    <g>
      <rect x="18" y="296" width="152" height="104" fill="#EBD5AC"/>
      <rect x="18" y="288" width="152" height="14" fill="#A64B2A"/>
      <rect x="342" y="296" width="152" height="104" fill="#EBD5AC"/>
      <rect x="342" y="288" width="152" height="14" fill="#A64B2A"/>
    </g>
    <g fill="#4A2114">
      <path d="M30 400 V352 a13 13 0 0 1 26 0 V400 Z"/>
      <path d="M66 400 V352 a13 13 0 0 1 26 0 V400 Z"/>
      <path d="M102 400 V352 a13 13 0 0 1 26 0 V400 Z"/>
      <path d="M138 400 V352 a13 13 0 0 1 26 0 V400 Z"/>
      <path d="M354 400 V352 a13 13 0 0 1 26 0 V400 Z"/>
      <path d="M390 400 V352 a13 13 0 0 1 26 0 V400 Z"/>
      <path d="M426 400 V352 a13 13 0 0 1 26 0 V400 Z"/>
      <path d="M462 400 V352 a13 13 0 0 1 26 0 V400 Z"/>
    </g>

    <!-- catedral de la plaza -->
    <g fill="#F7EACB">
      <rect x="150" y="168" width="62" height="164"/>
      <rect x="300" y="168" width="62" height="164"/>
      <rect x="212" y="206" width="88" height="120"/>
    </g>
    <g fill="#A64B2A">
      <polygon points="142,168 181,112 220,168"/>
      <polygon points="292,168 331,112 370,168"/>
      <polygon points="204,206 256,166 308,206"/>
    </g>
    <g fill="#E0A24A">
      <circle cx="181" cy="110" r="9"/>
      <circle cx="331" cy="110" r="9"/>
    </g>
    <g stroke="#7E4028" stroke-width="5" stroke-linecap="round">
      <path d="M181 88 V110"/>
      <path d="M169 98 H193"/>
      <path d="M331 88 V110"/>
      <path d="M319 98 H343"/>
    </g>
    <rect x="204" y="204" width="104" height="7" fill="#E0A24A"/>
    <circle cx="256" cy="240" r="17" fill="#C98A3C"/>
    <g stroke="#7E4028" stroke-width="3">
      <path d="M239 240 H273"/>
      <path d="M256 223 V257"/>
    </g>
    <path d="M236 326 V290 a20 20 0 0 1 40 0 V326 Z" fill="#4A2114"/>
    <g fill="#4A2114" opacity="0.85">
      <rect x="222" y="266" width="12" height="20" rx="6"/>
      <rect x="278" y="266" width="12" height="20" rx="6"/>
    </g>

    <!-- pileta de la plaza -->
    <g>
      <rect x="248" y="360" width="16" height="22" fill="#C99B5E"/>
      <ellipse cx="256" cy="358" rx="24" ry="7" fill="#E7CFA0"/>
      <ellipse cx="256" cy="384" rx="54" ry="12" fill="#D9BC8C"/>
      <ellipse cx="256" cy="382" rx="44" ry="8" fill="#9AD0E0" opacity="0.75"/>
      <path d="M244 350 q-4 8 0 12 M268 350 q4 8 0 12" fill="none" stroke="#BFE4EE" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- cinta con el nombre -->
    <rect x="18" y="404" width="476" height="90" fill="#3E1B10" opacity="0.9"/>
    <path d="M120 416 H392" stroke="#E0A24A" stroke-width="2" opacity="0.7"/>
    <text x="256" y="458" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="58" font-weight="bold" letter-spacing="6" fill="#F9E9C4">AYACUCHO</text>
    <text x="256" y="481" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="16" letter-spacing="3" fill="#EBB36A">PLAZA DE HUAMANGA</text>
  </g>

  <!-- adornos del marco -->
  <rect x="30" y="30" width="452" height="452" rx="78" fill="none" stroke="#F2D9A8"
        stroke-width="5" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.85"/>
  <rect x="24" y="24" width="464" height="464" rx="82" fill="none" stroke="#F2D9A8" stroke-width="3" opacity="0.45"/>
</svg>

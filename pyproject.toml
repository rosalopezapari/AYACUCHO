[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turismo-ayacucho"
version = "0.1.0"
description = "App de turismo de Ayacucho, Perú"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["colorama>=0.4.6"]

[project.scripts]
ayacucho = "ayacucho.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ayacucho*"]